model: anthropic/claude-opus-5

budgets:
  max_calls: 12
  # Wall clock, not just calls and dollars: a run wedged on a slow tool burns
  # real time against no ceiling otherwise.
  max_wall_ms: 1800000
  max_cost_usd: 5.00

runtime:
  max_turns: 6
  result_cap: 20000
  recall_limit: 3

tools:
  - id: duckdb_query
    kind: duckdb
    database: ./fixtures/records.duckdb
    max_rows: 200
    timeout_ms: 30000
  - id: expand
    kind: expand
  - id: intel_lookup
    kind: threatfox
    feed: https://threatfox.abuse.ch/export/json/recent/
  - id: web_intel
    kind: firecrawl
    limit: 3

approvals: []

thresholds:
  min_corroborating_sources: 2
  gap_lock_threshold: 3
  priority_floor: 5
