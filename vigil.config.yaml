model: anthropic/claude-opus-5

# USD per million tokens. Wrong here means the cost budget is wrong.
rates:
  input: 15.00
  output: 75.00

budgets:
  max_iterations: 12
  max_cost_usd: 5.00

runtime:
  concurrency: 4
  rate_limit: { rpm: 60, tpm: 200000 }
  retry_attempts: 3

tools:
  - id: duckdb_query
    kind: duckdb
    database: ~/Downloads/botsv3_duckdb/botsv3.duckdb
    max_rows: 200
    timeout_ms: 30000
    memory_limit: 2GB
  - id: expand
    kind: expand
  # Indexed once at hunt start. A local export path works too; THREATFOX_API_KEY
  # is sent when set, which the public recent export does not require.
  - id: intel_lookup
    kind: threatfox
    feed: https://threatfox.abuse.ch/export/json/recent/
  # Published reporting on an observable. FIRECRAWL_API_KEY comes from the
  # environment; without it the tool builds and fails per call as a gap.
  - id: web_intel
    kind: firecrawl
    limit: 3

# Lookups with a fixed shape, run by the controller with no model in the loop, so
# they cost no iteration. Here rather than in the arch because the SQL is a fact
# about this deployment's schema, and because nothing uploadable may declare one.
enrichment:
  max_depth: 2
  max_entities: 8
  chains:
    - id: process_lineage
      on: process
      tool: duckdb_query
      # Sysmon lineage lives in the raw XML; win_events maps only Image to a column.
      query: |
        SELECT regexp_extract(_raw, 'Name=''ParentImage''>([^<]*)', 1) AS parent_process,
               regexp_extract(_raw, 'Name=''Company''>([^<]*)', 1) AS signer,
               regexp_extract(_raw, 'Name=''Hashes''>([^<]*)', 1) AS hashes,
               count(*) AS starts, count(DISTINCT computer) AS hosts
        FROM win_events
        WHERE event_code = 1 AND lower(process) = lower('{{value}}')
        GROUP BY 1, 2, 3 ORDER BY starts DESC LIMIT 5
