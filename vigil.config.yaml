model: anthropic/claude-opus-5

# USD per million tokens. Wrong here means the cost budget is wrong.
rates:
  input: 5.00
  output: 25.00

budgets:
  max_iterations: 12
  max_cost_usd: 5.00

# What a hypothesis must clear to be proven. Counted by the controller from the
# ledger — a model's own confidence never enters this.
verdicts:
  # Distinct source systems supporting it. One system agreeing with itself is
  # not corroboration.
  min_corroborating_sources: 2
  # Unanswered queries bearing on it before the verdict closes inconclusive:
  # "we could not look" must never read as "we cleared it".
  gap_lock_threshold: 3

# When a hunt may stop, and how far an operator may push it. The controller owns
# termination — CONCLUDE is a recommendation measured against these.
termination:
  # Frontier score at or above which an open question still blocks conclusion.
  # Scores run 0–16 (novel 3, bearing hypotheses up to 6, salience up to 4,
  # recency up to 3); 5 is a novel lead bearing on one active hypothesis. Below
  # it a lead is backlog, not a reason to keep spending.
  priority_floor: 5
  # A hunt parked at the budget checkpoint this long with no answer is abandoned
  # in fact; saying so beats leaving it parked forever. Seven days.
  park_ttl_ms: 604800000
  # What an operator may extend to, in total. Twice the budgets above: double
  # down, don't run forever.
  hard_max_iterations: 24
  hard_max_cost_usd: 10.00

# Where a human is in the loop. ask suspends the hunt until someone answers;
# auto answers on the spot and journals that policy did it — either way the
# approval is a ledger event, and an approval that is not on the ledger never
# happened. These defaults keep a headless or scripted run moving with no TTY
# and nothing pending; a supervised deployment flips the first and third to ask
# (see demo.config.yaml, which the demo walk uses).
checkpoints:
  # At hunt start, before any query runs.
  hypothesis_approval: auto
  # Growth past the declared scope. Only fires when a playbook declares one; a
  # lead naming a different tenant is refused outright, never asked about.
  scope_extension: ask
  # Before a hypothesis is marked proven, and before the hunt concludes.
  verdict_review: auto
  # The Hunt Lead's own CHECKPOINT: it is asking for an adult.
  budget_anomaly: ask

runtime:
  concurrency: 4
  rate_limit: { rpm: 60, tpm: 200000 }
  retry_attempts: 3

tools:
  - id: duckdb_query
    kind: duckdb
    database: ~/Downloads/botsv3_duckdb/botsv3.duckdb
    max_rows: 200
    timeout_ms: 30000
    memory_limit: 2GB
  - id: expand
    kind: expand
  # Indexed once at hunt start. A local export path works too; THREATFOX_API_KEY
  # is sent when set, which the public recent export does not require.
  - id: intel_lookup
    kind: threatfox
    feed: https://threatfox.abuse.ch/export/json/recent/
  # Published reporting on an observable. FIRECRAWL_API_KEY comes from the
  # environment; without it the tool builds and fails per call as a gap.
  - id: web_intel
    kind: firecrawl
    limit: 3

# Lookups with a fixed shape, run by the controller with no model in the loop, so
# they cost no iteration. Here rather than in the arch because the SQL is a fact
# about this deployment's schema, and because nothing uploadable may declare one.
enrichment:
  max_depth: 2
  max_entities: 8
  chains:
    - id: process_lineage
      on: process
      tool: duckdb_query
      # Sysmon lineage lives in the raw XML; win_events maps only Image to a column.
      query: |
        SELECT regexp_extract(_raw, 'Name=''ParentImage''>([^<]*)', 1) AS parent_process,
               regexp_extract(_raw, 'Name=''Company''>([^<]*)', 1) AS signer,
               regexp_extract(_raw, 'Name=''Hashes''>([^<]*)', 1) AS hashes,
               count(*) AS starts, count(DISTINCT computer) AS hosts
        FROM win_events
        WHERE event_code = 1 AND lower(process) = lower('{{value}}')
        GROUP BY 1, 2, 3 ORDER BY starts DESC LIMIT 5
