name: Frothly external C2 and cloud credential misuse

hypotheses:
  - An internal host is beaconing to external infrastructure on a regular interval
  - A Frothly AWS identity is making API calls from infrastructure it has not used before

attack_techniques:
  - T1071.001
  - T1078.004

data_domains: [net_flow, dns, http, win_events, endpoint, cloud]

directives:
  lead: |
    This hunt covers the Frothly dataset: roughly 1.9M events from 2018-08-19 to
    2018-08-20 across network capture, Windows and Sysmon logs, osquery endpoint
    results, and AWS CloudTrail. The trail is deliberately multi-domain, so a
    finding in one domain should be pivoted into another rather than confirmed
    only where it was found.
  worker: |
    Start from the mapped views (net_flow, dns, http, win_events, endpoint,
    cloud) and fall back to the lossless events table when no view covers the
    sourcetype. Internal space is 192.168.0.0/16 and 172.16.0.0/12; the internal
    domain is froth.ly. The data spans 2018-08-19 to 2018-08-20 only.

narrative: |
  Frothly is a small brewing company. The dataset spans a single night and mixes
  network capture, Windows and Sysmon logs, osquery endpoint results, and AWS
  CloudTrail.
